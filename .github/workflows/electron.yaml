name: Electron Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: photosynth-windows-x64
          - name: macOS x64
            os: macos-15-intel
            artifact: photosynth-macos-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: photosynth-linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Prepare Windows MIDI Services SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./actions/prepare-windows-midi-sdk.ps1

      - name: Select Visual Studio 2022 build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate assets
        shell: bash
        run: |
          node actions/zips.mjs
          node actions/build-profile.mjs

      - name: Verify Windows MIDI native addon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $addon = 'source/electron/lib/windows-midi-services/build/Release/photosynth_windows_midi.node'
          if (!(Test-Path $addon)) { throw "Native MIDI addon was not built: $addon" }

      - name: Verify macOS CoreMIDI 2.0 native addon
        if: runner.os == 'macOS'
        shell: bash
        run: test -f source/electron/lib/macos-coremidi/build/Release/photosynth_macos_coremidi.node

      - name: Verify Squirrel ZIP tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vendor = 'node_modules/electron-winstaller/vendor'
          if (!(Test-Path "$vendor/7z.exe")) { throw 'electron-winstaller did not select its architecture-specific 7z.exe' }
          if (!(Test-Path "$vendor/7z.dll")) { throw 'electron-winstaller did not select its architecture-specific 7z.dll' }

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - name: Enable Windows delta updates when a previous feed exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $feed = 'https://interface.place/updates/win32/x64'
          try {
            Invoke-WebRequest -Uri "$feed/RELEASES" -Method Head -ErrorAction Stop | Out-Null
            "PHOTOSYNTH_WINDOWS_UPDATE_URL=$feed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Previous update feed found; Squirrel delta generation enabled."
          } catch {
            Write-Host "No previous update feed found; this release will contain a full package only."
          }

      - name: Build installers
        run: pnpm run electron:make

      - name: Verify packaged Windows MIDI native addon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $addon = Get-ChildItem releases -Recurse -Filter photosynth_windows_midi.node | Select-Object -First 1
          if (!$addon) { throw 'Packaged application does not contain the native MIDI addon' }
          Write-Host "Packaged native MIDI addon: $($addon.FullName)"

      - name: Verify packaged macOS CoreMIDI 2.0 native addon
        if: runner.os == 'macOS'
        shell: bash
        run: find releases -name photosynth_macos_coremidi.node -print -quit | grep .

      - name: Remove previous Windows packages after creating the delta
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Get-ChildItem releases/make -Recurse -Filter *.nupkg |
            Where-Object { $_.Name -notlike "*-$version-*" } |
            Remove-Item -Force

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: releases/make/**/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: photosynth-*
          path: release-assets
          merge-multiple: true

      - name: Prepare static update manifests
        shell: bash
        run: |
          node actions/electron-update-feed.mjs \
            --assets release-assets \
            --output release-feed \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --version "${GITHUB_REF_NAME#v}" \
            --publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload Pages update feed
        uses: actions/upload-artifact@v7
        with:
          name: photosynth-update-feed
          path: release-feed/**/*
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/**/*
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true

  pages:
    name: Publish website and update feed
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website and desktop web application
        run: pnpm run build

      - name: Add Electron update manifests
        uses: actions/download-artifact@v8
        with:
          name: photosynth-update-feed
          path: releases/web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: releases/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
