name: Deploy to “interface.place” via GitHub Pages

on:
     # Trigger the workflow every time you push to the `main` branch
    push:
        branches: [ main ]

      # Allows you to run this workflow manually from the Actions tab on GitHub.
    workflow_dispatch:

    # Allow this job to clone the repo and create a page deployment
permissions:
    actions: read
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checks out this repository using git
              uses: actions/checkout@v6

            # Install pnpm
            - uses: pnpm/action-setup@v6
              name: Install pnpm
              with:
                run_install: false
                version: 11.21.0

            # Install node js
            - name: Install Node.js 24
              uses: actions/setup-node@v6
              with:
                node-version-file: ".nvmrc"
                cache: pnpm

            # Install project node dependencies
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Build assets and the application
            - name: Build the app
              run: pnpm run build

            # - name: List the current folder contents...
            #   run: ls ./

            - name: List the build folder contents...
              run: ls ./releases/web

            - name: Upload artifact
              id: deployment
              uses: actions/upload-pages-artifact@v5
              with:
                name: github-pages
                path: ./releases/web

    deploy:
    
        # Add a dependency to the build job
        needs: build
            
        # Specify runner + deployment step
        runs-on: ubuntu-latest

        # Deploy to the github-pages environment
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
        permissions:
            pages: write      # to deploy to Pages
            id-token: write   # to verify the deployment originates from an appropriate source
    
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
