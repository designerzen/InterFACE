<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1110' viewBox='0 0 1200 1110' role='img' aria-labelledby='title description'><title id='title'>PhotoSYNTH operating mode concepts</title><desc id='description'>Twelve mode icons with interaction descriptions. The first two head mappings exist; the other ten modes are proposed.</desc><rect width='1200' height='1110' fill='#101727'/><g font-family='Segoe UI, Arial, sans-serif'><text x='32' y='51' fill='#a6c9ff' font-size='13' letter-spacing='3'>PHOTOSYNTH / INPUT MODES</text><text x='32' y='95' fill='#f3f5fc' font-size='34' font-weight='650'>One button. Different ways to play.</text><text x='32' y='126' fill='#a6b3cb' font-size='16'>Mood + head is the default. Reversed mood swaps the note and octave axes.</text><g transform='translate(32 156)'><rect width='366' height='208' rx='18' fill='#192235' stroke='#303c53'/><svg x='20' y='18' width='44' height='44' viewBox='-1 -1 26 26' fill='none' stroke='#a7f3cb' stroke-width='1.65' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='6.5'/><path d='M9 10h.01M15 10h.01M9 14q3 3 6 0M2 9V5h4M22 15v4h-4'/><path d='M2 5l3 3M22 19l-3-3'/></svg><text x='20' y='95' fill='#f3f5fc' font-size='21' font-weight='600'>Mood + head</text><text x='78' y='44' fill='#a7f3cb' font-size='10' font-weight='700' letter-spacing='.7'>DEFAULT · EXISTING</text><text x='20' y='132' fill='#c1cadb' font-size='15'>Head tilt selects notes; nose up/down</text><text x='20' y='154' fill='#c1cadb' font-size='15'>selects octaves. Mouth plays; expressions</text><text x='20' y='176' fill='#c1cadb' font-size='15'>shape harmony and character.</text></g><g transform='translate(422 156)'><rect width='366' height='208' rx='18' fill='#192235' stroke='#303c53'/><svg x='20' y='18' width='44' height='44' viewBox='-1 -1 26 26' fill='none' stroke='#c6b7ff' stroke-width='1.65' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='6'/><path d='M9 10h.01M15 10h.01M9 14q3 3 6 0M3 8V3h5M3 3l4 4M21 16v5h-5M21 21l-4-4'/></svg><text x='20' y='95' fill='#f3f5fc' font-size='21' font-weight='600'>Reversed mood</text><text x='78' y='44' fill='#c6b7ff' font-size='10' font-weight='700' letter-spacing='.7'>AXIS SWAP · EXISTING</text><text x='20' y='132' fill='#c1cadb' font-size='15'>Head up/down selects notes; sideways</text><text x='20' y='154' fill='#c1cadb' font-size='15'>tilt selects octaves. Keep mouth and</text><text x='20' y='176' fill='#c1cadb' font-size='15'>expression controls from Mood + head.</text></g><g transform='translate(812 156)'><rect width='366' height='208' rx='18' fill='#192235' stroke='#303c53'/><svg x='20' y='18' width='44' height='44' viewBox='-1 -1 26 26' fill='none' stroke='#a6c9ff' stroke-width='1.65' stroke-linecap='round' stroke-linejoin='round'><path d='M2 10s4-6 10-6 10 6 10 6-4 6-10 6S2 10 2 10Z'/><circle cx='12' cy='10' r='3'/><path d='M8 21h8M5 19l-2 2 2 2M19 19l2 2-2 2'/></svg><text x='20' y='95' fill='#f3f5fc' font-size='21' font-weight='600'>Eye control</text><text x='78' y='44' fill='#a6c9ff' font-size='10' font-weight='700' letter-spacing='.7'>PROPOSED · FACE + IRIS</text><text x='20' y='132' fill='#c1cadb' font-size='15'>Iris position left/right selects notes.</text><text x='20' y='154' fill='#c1cadb' font-size='15'>Point the nose slightly up/down for</text><text x='20' y='176' fill='#c1cadb' font-size='15'>octaves; deliberate dwell plays a note.</text></g><g transform='translate(32 384)'><rect width='366' height='208' rx='18' fill='#192235' stroke='#303c53'/><svg x='20' y='18' width='44' height='44' viewBox='-1 -1 26 26' fill='none' stroke='#a6c9ff' stroke-width='1.65' stroke-linecap='round' stroke-linejoin='round'><path d='M3 6q2 3 4 0M11 6q2 3 4 0M5 11q4 4 8 0'/><rect x='2' y='17' width='4' height='4' rx='1'/><rect x='10' y='17' width='4' height='4' rx='1'/><rect x='18' y='17' width='4' height='4' rx='1'/><path d='M20 3v9M18 10l2 2 2-2'/></svg><text x='20' y='95' fill='#f3f5fc' font-size='21' font-weight='600'>Face drum sequencer</text><text x='78' y='44' fill='#a6c9ff' font-size='10' font-weight='700' letter-spacing='.7'>PROPOSED · FACE</text><text x='20' y='132' fill='#c1cadb' font-size='15'>Smile, open mouth or raise brows to</text><text x='20' y='154' fill='#c1cadb' font-size='15'>select a drum. Deliberately close eyes</text><text x='20' y='176' fill='#c1cadb' font-size='15'>to toggle the current step in a loop.</text></g><g transform='translate(422 384)'><rect width='366' height='208' rx='18' fill='#192235' stroke='#303c53'/><svg x='20' y='18' width='44' height='44' viewBox='-1 -1 26 26' fill='none' stroke='#a6c9ff' stroke-width='1.65' stroke-linecap='round' stroke-linejoin='round'><path d='M8 17V7a1.5 1.5 0 0 1 3 0v5-8a1.5 1.5 0 0 1 3 0v8-6a1.5 1.5 0 0 1 3 0v7-4a1.5 1.5 0 0 1 3 0v7q0 6-6 6h-2q-3 0-5-3l-3-4q-1-2 1-2l3 2'/><path d='M2 9V3M.5 5 2 3l1.5 2'/></svg><text x='20' y='95' fill='#f3f5fc' font-size='21' font-weight='600'>Relative hand notes</text><text x='78' y='44' fill='#a6c9ff' font-size='10' font-weight='700' letter-spacing='.7'>PROPOSED · HAND</text><text x='20' y='132' fill='#c1cadb' font-size='15'>Move sideways from a calibrated hand</text><text x='20' y='154' fill='#c1cadb' font-size='15'>position to step through notes. Relative</text><text x='20' y='176' fill='#c1cadb' font-size='15'>height sets octave; pinch plays a note.</text></g><g transform='translate(812 384)'><rect width='366' height='208' rx='18' fill='#192235' stroke='#303c53'/><svg x='20' y='18' width='44' height='44' viewBox='-1 -1 26 26' fill='none' stroke='#a6c9ff' stroke-width='1.65' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='11' width='20' height='10' rx='2'/><path d='M7 11v10M12 11v10M17 11v10M5 11v4M10 11v4M15 11v4M20 11v4M8 5h8M10 3 8 5l2 2M14 3l2 2-2 2'/></svg><text x='20' y='95' fill='#f3f5fc' font-size='21' font-weight='600'>Air keyboard</text><text x='78' y='44' fill='#a6c9ff' font-size='10' font-weight='700' letter-spacing='.7'>PROPOSED · HAND</text><text x='20' y='132' fill='#c1cadb' font-size='15'>Fixed left/right hand zones select</text><text x='20' y='154' fill='#c1cadb' font-size='15'>notes; height selects octave. Pinch to</text><text x='20' y='176' fill='#c1cadb' font-size='15'>play; release to stop the note.</text></g><g transform='translate(32 612)'><rect width='366' height='208' rx='18' fill='#192235' stroke='#303c53'/><svg x='20' y='18' width='44' height='44' viewBox='-1 -1 26 26' fill='none' stroke='#a6c9ff' stroke-width='1.65' stroke-linecap='round' stroke-linejoin='round'><path d='M2 12V8a1 1 0 0 1 2 0v4-7a1 1 0 0 1 2 0v7-5a1 1 0 0 1 2 0v6l2-2v6q0 4-4 4t-4-4v-5ZM22 12V8a1 1 0 0 0-2 0v4-7a1 1 0 0 0-2 0v7-5a1 1 0 0 0-2 0v6l-2-2v6q0 4 4 4t4-4v-5Z'/></svg><text x='20' y='95' fill='#f3f5fc' font-size='21' font-weight='600'>Two-hand instrument</text><text x='78' y='44' fill='#a6c9ff' font-size='10' font-weight='700' letter-spacing='.7'>PROPOSED · TWO HANDS</text><text x='20' y='132' fill='#c1cadb' font-size='15'>One hand selects notes and octaves;</text><text x='20' y='154' fill='#c1cadb' font-size='15'>the other shapes volume and tone.</text><text x='20' y='176' fill='#c1cadb' font-size='15'>Pinch the note hand to play.</text></g><g transform='translate(422 612)'><rect width='366' height='208' rx='18' fill='#192235' stroke='#303c53'/><svg x='20' y='18' width='44' height='44' viewBox='-1 -1 26 26' fill='none' stroke='#a6c9ff' stroke-width='1.65' stroke-linecap='round' stroke-linejoin='round'><ellipse cx='12' cy='13' rx='8' ry='3'/><path d='M4 13v6q8 5 16 0v-6M8 15v6M16 15v6M4 3l6 6M20 3l-6 6M2 5l6 6M22 5l-6 6'/></svg><text x='20' y='95' fill='#f3f5fc' font-size='21' font-weight='600'>Air drums</text><text x='78' y='44' fill='#a6c9ff' font-size='10' font-weight='700' letter-spacing='.7'>PROPOSED · HANDS</text><text x='20' y='132' fill='#c1cadb' font-size='15'>Downward strikes in virtual drum zones</text><text x='20' y='154' fill='#c1cadb' font-size='15'>trigger kick, snare and hi-hat. Strike</text><text x='20' y='176' fill='#c1cadb' font-size='15'>speed controls how hard each hit sounds.</text></g><g transform='translate(812 612)'><rect width='366' height='208' rx='18' fill='#192235' stroke='#303c53'/><svg x='20' y='18' width='44' height='44' viewBox='-1 -1 26 26' fill='none' stroke='#a6c9ff' stroke-width='1.65' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='4' r='2'/><path d='M12 6v8M5 8l7 2 7-2M12 14l-5 7M12 14l5 7M2 12l-1 2 1 2M22 12l1 2-1 2'/></svg><text x='20' y='95' fill='#f3f5fc' font-size='21' font-weight='600'>Body control</text><text x='78' y='44' fill='#a6c9ff' font-size='10' font-weight='700' letter-spacing='.7'>PROPOSED · POSE</text><text x='20' y='132' fill='#c1cadb' font-size='15'>Lean left/right to select notes; stand</text><text x='20' y='154' fill='#c1cadb' font-size='15'>taller or lower for octaves. A chosen</text><text x='20' y='176' fill='#c1cadb' font-size='15'>arm gesture starts and stops sound.</text></g><g transform='translate(32 840)'><rect width='366' height='208' rx='18' fill='#192235' stroke='#303c53'/><svg x='20' y='18' width='44' height='44' viewBox='-1 -1 26 26' fill='none' stroke='#a6c9ff' stroke-width='1.65' stroke-linecap='round' stroke-linejoin='round'><path d='M3 10a7 7 0 0 1 14 0M6 9h.01M12 9h.01M6 13q3 3 6 0M16 21V10l6-2v11M16 13l6-2'/><ellipse cx='14' cy='21' rx='2' ry='1'/><ellipse cx='20' cy='19' rx='2' ry='1'/></svg><text x='20' y='95' fill='#f3f5fc' font-size='21' font-weight='600'>Expression chords</text><text x='78' y='44' fill='#a6c9ff' font-size='10' font-weight='700' letter-spacing='.7'>PROPOSED · FACE</text><text x='20' y='132' fill='#c1cadb' font-size='15'>Choose a chord with a facial expression;</text><text x='20' y='154' fill='#c1cadb' font-size='15'>point the nose up/down for register.</text><text x='20' y='176' fill='#c1cadb' font-size='15'>Open the mouth to play and sustain it.</text></g><g transform='translate(422 840)'><rect width='366' height='208' rx='18' fill='#192235' stroke='#303c53'/><svg x='20' y='18' width='44' height='44' viewBox='-1 -1 26 26' fill='none' stroke='#a6c9ff' stroke-width='1.65' stroke-linecap='round' stroke-linejoin='round'><path d='M2 5h15M14 2l3 3-3 3'/><circle cx='5' cy='15' r='2'/><circle cx='12' cy='15' r='3'/><circle cx='20' cy='15' r='2'/><path d='M12 21v2'/></svg><text x='20' y='95' fill='#f3f5fc' font-size='21' font-weight='600'>Single-gesture play</text><text x='78' y='44' fill='#a6c9ff' font-size='10' font-weight='700' letter-spacing='.7'>PROPOSED · CHOSEN INPUT</text><text x='20' y='132' fill='#c1cadb' font-size='15'>Notes scan automatically through a scale.</text><text x='20' y='154' fill='#c1cadb' font-size='15'>Use one chosen blink, mouth movement</text><text x='20' y='176' fill='#c1cadb' font-size='15'>or pinch to select and play a note.</text></g><g transform='translate(812 840)'><rect width='366' height='208' rx='18' fill='#192235' stroke='#303c53'/><svg x='20' y='18' width='44' height='44' viewBox='-1 -1 26 26' fill='none' stroke='#a6c9ff' stroke-width='1.65' stroke-linecap='round' stroke-linejoin='round'><path d='M19 7a8 8 0 1 0 1 9M19 3v5h-5M9 16l7-10M8 17l-2 3M10 6v2M5 11h2'/><circle cx='9' cy='17' r='1'/></svg><text x='20' y='95' fill='#f3f5fc' font-size='21' font-weight='600'>Loop conductor</text><text x='78' y='44' fill='#a6c9ff' font-size='10' font-weight='700' letter-spacing='.7'>PROPOSED · HANDS</text><text x='20' y='132' fill='#c1cadb' font-size='15'>Conduct a running loop with gestures:</text><text x='20' y='154' fill='#c1cadb' font-size='15'>height shapes volume, sideways motion</text><text x='20' y='176' fill='#c1cadb' font-size='15'>shapes tone; a held fist pauses playback.</text></g></g></svg>
