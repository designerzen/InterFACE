blockExoticSubdeps: false

packages:
  - source/electron/lib/macos-coremidi
  - source/electron/lib/windows-midi-services

nodeLinker: hoisted

# pnpm may need to recreate node_modules after a pnpm or linker change. Dev and
# build commands run without an interactive TTY, so allow that refresh instead
# of aborting while waiting for confirmation.
confirmModulesPurge: false

# pnpm 11 otherwise runs an implicit install before every script when its
# dependency metadata differs. Keep dev/build commands from mutating
# node_modules inside a non-interactive subprocess.
verifyDepsBeforeRun: false

allowBuilds:
  '@photosynth/macos-coremidi': true
  '@photosynth/windows-midi-services': true
  '@parcel/watcher': false
  '@serialport/bindings-cpp': false
  '@swc/core': false
  bufferutil: false
  core-js: false
  electron-winstaller: false
  esbuild: false
  lmdb: false
  midi-writer-js: false
  msgpackr-extract: false
  netronome@https://codeload.github.com/designerzen/netronome/tar.gz/26cd23d66cec473616130f6b72ba4754058fb82e: true
  phantomjs-prebuilt: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false
  workerd: false

minimumReleaseAgeExclude:
  - '@audio/decode@3.11.1'
  - abcjs@6.6.4
  - audio-decode@3.11.2 || 3.12.0
  - postcss@8.5.17 || 8.5.19 || 8.5.22 || 8.5.23
  - svgo@4.0.2
  - '@babylonjs/core@9.17.1 || 9.18.0 || 9.21.1 || 9.22.0'
  - '@babylonjs/gui-editor@9.17.1 || 9.18.0 || 9.21.1 || 9.22.0'
  - '@babylonjs/inspector@9.17.1 || 9.18.0 || 9.21.1 || 9.22.0'
  - '@babylonjs/loaders@9.17.1 || 9.18.0 || 9.21.1 || 9.22.0'
  - '@babylonjs/materials@9.17.1 || 9.18.0 || 9.21.1 || 9.22.0'
  - electron@43.2.0 || 43.4.0
  - knip@6.28.0 || 6.29.0 || 6.32.1 || 6.32.2
  - '@electron/packager@20.0.4 || 20.3.0'
