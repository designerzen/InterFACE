blockExoticSubdeps: false

packages:
  - source/electron/lib/macos-coremidi
  - source/electron/lib/windows-midi-services

nodeLinker: hoisted

# Use the installed pnpm with a version warning. Automatic version downloads
# currently fail to locate their wrapper on this Windows setup.
pmOnFail: warn

# pnpm 11 otherwise runs an implicit install before every script when its
# dependency metadata differs. Keep dev/build commands from mutating
# node_modules inside a non-interactive subprocess.
verifyDepsBeforeRun: false

allowBuilds:
  '@photosynth/macos-coremidi': true
  '@photosynth/windows-midi-services': true
  '@parcel/watcher': false
  '@serialport/bindings-cpp': false
  '@swc/core': false
  bufferutil: false
  core-js: false
  electron-winstaller: true
  esbuild: false
  lmdb: false
  midi-writer-js: false
  msgpackr-extract: false
  netronome@https://codeload.github.com/designerzen/netronome/tar.gz/f4c6d48e3253a4e712f600f7e02217b95bf180ab: true
  phantomjs-prebuilt: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false
  workerd: false

minimumReleaseAgeExclude:
  - '@audio/decode@3.11.1'
  - abcjs@6.6.4
  - audio-decode@3.11.2 || 3.12.0
  - postcss@8.5.17 || 8.5.19 || 8.5.22 || 8.5.23
